name: Frankenstein CPU Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID unico del trabajo"
        required: true
        type: string

      job:
        description: "Tipo de trabajo"
        required: true
        type: string

      payload:
        description: "Datos del trabajo en JSON"
        required: false
        default: "{}"
        type: string

      callback_url:
        description: "URL de retorno de Frankenstein"
        required: true
        type: string


jobs:
  cpu-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Frankenstein CPU Worker
        env:
          JOB_ID: ${{ inputs.job_id }}
          JOB: ${{ inputs.job }}
          PAYLOAD: ${{ inputs.payload }}

        run: |
          echo "=== FRANKENSTEIN CPU WORKER ==="
          echo "Job ID: $JOB_ID"
          echo "Job recibido: $JOB"
          echo ""

          python3 - <<'PY'
          import os
          import json
          import hashlib

          job_id = os.environ["JOB_ID"]
          job = os.environ["JOB"]

          try:
              payload = json.loads(
                  os.environ.get("PAYLOAD", "{}")
              )
          except json.JSONDecodeError:
              raise SystemExit(
                  "ERROR: payload no es JSON valido"
              )

          print("Job ID:", job_id)
          print("Job:", job)
          print("Payload:", payload)

          if job == "test":
              print("Ejecutando prueba de CPU...")

              data = b"frankenstein"

              for _ in range(1_000_000):
                  data = hashlib.sha256(data).digest()

              result = {
                  "status": "completed",
                  "job_id": job_id,
                  "job": "test",
                  "result": data.hex()
              }

          elif job == "sha256":
              text = str(payload.get("text", ""))

              result = {
                  "status": "completed",
                  "job_id": job_id,
                  "job": "sha256",
                  "input": text,
                  "result": hashlib.sha256(
                      text.encode("utf-8")
                  ).hexdigest()
              }

          else:
              result = {
                  "status": "error",
                  "job_id": job_id,
                  "job": job,
                  "error": "unknown_job"
              }

          print("")
          print("=== RESULTADO ===")
          print(json.dumps(result))

          with open(
              "/tmp/frankenstein-result.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(result, f)
          PY


      - name: Return result to Frankenstein
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_SECRET: ${{ secrets.FRANKENSTEIN_CALLBACK_SECRET }}

        run: |
          echo "Devolviendo resultado a Frankenstein..."

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output /tmp/callback-response.txt \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $CALLBACK_SECRET" \
            --data-binary @/tmp/frankenstein-result.json \
            "$CALLBACK_URL")

          echo "Frankenstein HTTP status: $HTTP_CODE"

          cat /tmp/callback-response.txt

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo ""
            echo "ERROR: Frankenstein rechazo el resultado."
            exit 1
          fi

          echo ""
          echo "Resultado entregado correctamente."
