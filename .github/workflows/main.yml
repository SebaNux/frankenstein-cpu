name: Frankenstein CPU Worker

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Tipo de trabajo"
        required: true
        default: "test"

      payload:
        description: "Datos del trabajo en JSON"
        required: false
        default: "{}"

jobs:
  cpu-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Frankenstein CPU Worker
        env:
          JOB: ${{ inputs.job }}
          PAYLOAD: ${{ inputs.payload }}

        run: |
          echo "=== FRANKENSTEIN CPU WORKER ==="
          echo "Job recibido: $JOB"
          echo ""

          python3 - <<'PY'
          import os
          import json
          import hashlib

          job = os.environ["JOB"]

          try:
              payload = json.loads(os.environ.get("PAYLOAD", "{}"))
          except json.JSONDecodeError:
              raise SystemExit("ERROR: payload no es JSON valido")

          print("Job:", job)
          print("Payload:", payload)

          if job == "test":
              print("Ejecutando prueba de CPU...")

              data = b"frankenstein"

              for _ in range(1_000_000):
                  data = hashlib.sha256(data).digest()

              result = {
                  "status": "completed",
                  "job": "test",
                  "result": data.hex()
              }

          elif job == "sha256":
              text = str(payload.get("text", ""))

              result = {
                  "status": "completed",
                  "job": "sha256",
                  "input": text,
                  "result": hashlib.sha256(
                      text.encode("utf-8")
                  ).hexdigest()
              }

          else:
              result = {
                  "status": "error",
                  "error": "unknown_job",
                  "job": job
              }

          print("")
          print("=== RESULTADO ===")
          print(json.dumps(result))
          PY
