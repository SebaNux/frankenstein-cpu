name: Frankenstein CPU Worker

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Tipo de trabajo"
        required: true
        default: "test"

      payload:
        description: "Datos del trabajo en JSON"
        required: false
        default: "{}"

jobs:
  cpu-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Frankenstein CPU Worker
        env:
          JOB: ${{ inputs.job }}
          PAYLOAD: ${{ inputs.payload }}
          CALLBACK_SECRET: ${{ secrets.FRANKENSTEIN_CALLBACK_SECRET }}
          CALLBACK_URL: https://frankenstein-gateway.sebastian-ulloa-verges.workers.dev/github-callback

        run: |
          echo "=== FRANKENSTEIN CPU WORKER ==="
          echo "Job recibido: $JOB"
          echo ""

          python3 - <<'PY'
          import os
          import json
          import hashlib
          import urllib.request

          job = os.environ["JOB"]

          try:
              payload = json.loads(os.environ.get("PAYLOAD", "{}"))
          except json.JSONDecodeError:
              raise SystemExit("ERROR: payload no es JSON valido")

          print("Job:", job)
          print("Payload:", payload)

          if job == "test":
              print("Ejecutando prueba de CPU...")

              data = b"frankenstein"

              for _ in range(1_000_000):
                  data = hashlib.sha256(data).digest()

              result = {
                  "status": "completed",
                  "job": "test",
                  "result": data.hex()
              }

          elif job == "sha256":
              text = str(payload.get("text", ""))

              result = {
                  "status": "completed",
                  "job": "sha256",
                  "input": text,
                  "result": hashlib.sha256(
                      text.encode("utf-8")
                  ).hexdigest()
              }

          else:
              result = {
                  "status": "error",
                  "error": "unknown_job",
                  "job": job
              }

          print("")
          print("=== RESULTADO ===")
          print(json.dumps(result))

          callback_url = os.environ["CALLBACK_URL"]
          callback_secret = os.environ["CALLBACK_SECRET"]

          callback_body = json.dumps(result).encode("utf-8")

          request = urllib.request.Request(
              callback_url,
              data=callback_body,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "X-Frankenstein-Secret": callback_secret,
                  "User-Agent": "Mozilla/5.0 Frankenstein-CPU/1.0"
              }
          )

          print("")
          print("Enviando resultado a Frankenstein Gateway...")

          with urllib.request.urlopen(request, timeout=15) as response:
              response_body = response.read().decode("utf-8")

              print("Callback HTTP:", response.status)
              print("Callback response:", response_body)

              if response.status < 200 or response.status >= 300:
                  raise SystemExit("ERROR: callback rechazado")

          print("Resultado entregado correctamente.")
          PY
